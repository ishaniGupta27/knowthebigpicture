name: Run KnowTheTimeline

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Job id under remote jobs/"
        required: true
        type: string
      remote_root:
        description: "rclone remote root"
        required: true
        default: "gdrive:knowthetimeline"
        type: string
      execution_mode:
        description: "dry_run = offline plumbing; lite = content only (no images); real = full render"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - lite
          - real
      publish_youtube:
        description: "Upload the timeline as a private YouTube Short"
        required: true
        default: false
        type: boolean
      publish_instagram:
        description: "Publish the timeline as an Instagram Reel (uses instagram.publish_mode in job.json)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: knowthetimeline-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  run:
    name: Job ${{ inputs.job_id }} (${{ inputs.execution_mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      KTT_REMOTE_ROOT: ${{ inputs.remote_root }}
      KTT_JOB_ID: ${{ inputs.job_id }}
      KTT_EXECUTION_MODE: ${{ inputs.execution_mode }}
      KTT_PUBLISH_YOUTUBE: ${{ inputs.publish_youtube }}
      KTT_PUBLISH_INSTAGRAM: ${{ inputs.publish_instagram }}

    steps:
      - name: 01 Checkout repository
        uses: actions/checkout@v6

      - name: 02 Show run inputs
        run: |
          echo "Job id: ${KTT_JOB_ID}"
          echo "Remote root: ${KTT_REMOTE_ROOT}"
          echo "Execution mode: ${KTT_EXECUTION_MODE}"
          echo "Publish YouTube: ${KTT_PUBLISH_YOUTUBE}"
          echo "Publish Instagram: ${KTT_PUBLISH_INSTAGRAM}"
          echo "Runner: ${RUNNER_OS}"

      - name: 03 Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "code/requirements.txt"

      - name: 04 Install ffmpeg, rclone, and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rclone fonts-dejavu-core

      - name: 05 Show tool versions
        run: |
          python --version
          ffmpeg -version | head -n 1
          rclone version | head -n 1

      - name: 06 Install Python dependencies
        working-directory: code
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 07 Verify imports
        working-directory: code
        run: |
          python -m knowthetimeline.run --help

      - name: 08 Configure rclone from secret
        env:
          RCLONE_CONFIG_SECRET: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "${RCLONE_CONFIG_SECRET}" ]; then
            echo "Missing required GitHub secret: RCLONE_CONFIG"
            exit 1
          fi
          mkdir -p "${HOME}/.config/rclone"
          printf '%s' "${RCLONE_CONFIG_SECRET}" > "${HOME}/.config/rclone/rclone.conf"
          chmod 600 "${HOME}/.config/rclone/rclone.conf"
          echo "rclone config written"

      - name: 09 Verify OpenAI secret for real/lite runs
        if: ${{ inputs.execution_mode == 'real' || inputs.execution_mode == 'lite' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "Missing required GitHub secret for real/lite runs: OPENAI_API_KEY"
            exit 1
          fi
          echo "OPENAI_API_KEY is present"

      - name: 10 Verify YouTube secrets for publish
        if: ${{ inputs.execution_mode == 'real' && inputs.publish_youtube }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret for publish: ${name}"
              exit 1
            fi
          done
          echo "YouTube secrets are present"

      - name: 10b Verify Instagram secrets for publish
        if: ${{ inputs.execution_mode == 'real' && inputs.publish_instagram }}
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          for name in INSTAGRAM_ACCESS_TOKEN INSTAGRAM_USER_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub secret for publish: ${name}"
              exit 1
            fi
          done
          echo "Instagram secrets are present"

      - name: 11 Check remote folders
        run: |
          rclone lsd "${KTT_REMOTE_ROOT}"
          rclone lsf "${KTT_REMOTE_ROOT}/jobs/${KTT_JOB_ID}" --max-depth 3

      - name: 12 Run dry-run
        if: ${{ inputs.execution_mode == 'dry_run' }}
        working-directory: code
        run: |
          python -m knowthetimeline.run "${KTT_JOB_ID}" --remote --dry-run

      - name: 12b Run lite job (content only, no images)
        if: ${{ inputs.execution_mode == 'lite' }}
        working-directory: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m knowthetimeline.run "${KTT_JOB_ID}" --remote --lite

      - name: 13 Run real job (render, no publish)
        if: ${{ inputs.execution_mode == 'real' }}
        working-directory: code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m knowthetimeline.run "${KTT_JOB_ID}" --remote --no-publish

      - name: 14 Upload private YouTube Short
        if: ${{ inputs.execution_mode == 'real' && inputs.publish_youtube }}
        working-directory: code
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python -m knowthetimeline.publish "${KTT_JOB_ID}"

      - name: 14b Publish Instagram Reel
        if: ${{ inputs.execution_mode == 'real' && inputs.publish_instagram }}
        working-directory: code
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: |
          python -m knowthetimeline.publish_instagram "${KTT_JOB_ID}"

      - name: 15 Push job folder after publish layer
        if: ${{ always() && inputs.execution_mode == 'real' && (inputs.publish_youtube || inputs.publish_instagram) }}
        run: |
          if [ -d "jobs/${KTT_JOB_ID}" ]; then
            rclone copy "jobs/${KTT_JOB_ID}" "${KTT_REMOTE_ROOT}/jobs/${KTT_JOB_ID}" --progress --exclude .DS_Store --exclude "**/.DS_Store" --exclude "outputs/frames/**"
          else
            echo "No local job folder found to push"
          fi

      - name: 16 Show local job status
        if: always()
        run: |
          if [ -f "jobs/${KTT_JOB_ID}/status.json" ]; then
            cat "jobs/${KTT_JOB_ID}/status.json"
          else
            echo "No local status.json found"
          fi

      - name: 17 Write GitHub summary
        if: always()
        run: |
          {
            echo "## KnowTheTimeline Run"
            echo ""
            echo "- Job id: \`${KTT_JOB_ID}\`"
            echo "- Remote root: \`${KTT_REMOTE_ROOT}\`"
            echo "- Execution mode: \`${KTT_EXECUTION_MODE}\`"
            echo "- Publish YouTube: \`${KTT_PUBLISH_YOUTUBE}\`"
            echo "- Publish Instagram: \`${KTT_PUBLISH_INSTAGRAM}\`"
            echo ""
            echo "### Local Status"
            echo ""
            if [ -f "jobs/${KTT_JOB_ID}/status.json" ]; then
              echo '```json'
              cat "jobs/${KTT_JOB_ID}/status.json"
              echo '```'
            else
              echo "No local status file was created."
            fi
            echo ""
            echo "### YouTube"
            echo ""
            if [ -f "jobs/${KTT_JOB_ID}/outputs/youtube_upload.json" ]; then
              echo '```json'
              cat "jobs/${KTT_JOB_ID}/outputs/youtube_upload.json"
              echo '```'
            else
              echo "No YouTube upload result."
            fi
            echo ""
            echo "### Instagram"
            echo ""
            if [ -f "jobs/${KTT_JOB_ID}/outputs/instagram_upload.json" ]; then
              echo '```json'
              cat "jobs/${KTT_JOB_ID}/outputs/instagram_upload.json"
              echo '```'
            else
              echo "No Instagram publish result."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: 18 Upload GitHub artifact backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowthetimeline-job-${{ inputs.job_id }}
          path: jobs/${{ inputs.job_id }}/
          if-no-files-found: warn
          retention-days: 7
